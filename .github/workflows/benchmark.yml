name: STARXION benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run STARXION
        run: python starxion.py
      - name: Verify PASS
        run: python -c "import json; r=json.load(open('starxion_results.json')); assert r['status']=='PASS', r"
